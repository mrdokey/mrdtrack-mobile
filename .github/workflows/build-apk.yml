name: Build MRD Track Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi (White-Label)'
        required: false
        default: 'MRD Track'
      app_id:
        description: 'Application ID / Package Name'
        required: false
        default: 'id.mrdtrack.mobile'
      base_url:
        description: 'Base URL Server'
        required: false
        default: 'https://mrdtrack.mrdsolution.my.id'
      primary_hex:
        description: 'Warna Tema Hex (tanpa #)'
        required: false
        default: '2563EB'
      version_name:
        description: 'Versi App (contoh 1.0.0)'
        required: false
        default: '1.0.0'
      build_number:
        description: 'Version Code Play Store (harus naik tiap upload)'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android, Target SDK 35, Icon & Keystore
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'MRD Track' }}
          APP_ID: ${{ github.event.inputs.app_id || 'id.mrdtrack.mobile' }}
          PRIMARY_HEX: ${{ github.event.inputs.primary_hex || '2563EB' }}
          KEYSTORE_B64: ${{ secrets.MRDTRACK_KEYSTORE_BASE64 }}
        run: |
          pip install --quiet pillow
          flutter create --platforms=android --org id.mrdtrack --project-name mrdtrack_mobile .
          rm -f test/widget_test.dart

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/mrdtrack-release-key.jks
          elif [ -f "mrdtrack-release-key.jks" ]; then
            cp mrdtrack-release-key.jks android/app/mrdtrack-release-key.jks
          else
            echo "Keystore tidak ditemukan!" && exit 1
          fi

          python3 - << 'PY'
          import os, re
          from PIL import Image, ImageDraw

          app_name = os.environ.get('APP_NAME', 'MRD Track')
          app_id = os.environ.get('APP_ID', 'id.mrdtrack.mobile')
          hex_col = os.environ.get('PRIMARY_HEX', '2563EB').lstrip('#')
          rgb = tuple(int(hex_col[i:i+2], 16) for i in (0, 2, 4))

          # 1. Generate Launcher Icon modern (atau pakai assets/icon.png jika ada)
          if os.path.exists('assets/icon.png'):
              base_icon = Image.open('assets/icon.png').convert('RGBA').resize((512, 512))
          else:
              base_icon = Image.new('RGBA', (512, 512), (15, 23, 42, 255))
              d = ImageDraw.Draw(base_icon)
              d.rounded_rectangle([32, 32, 480, 480], radius=110, fill=rgb + (255,))
              d.ellipse([116, 116, 396, 396], outline=(255, 255, 255, 90), width=14)
              d.ellipse([172, 172, 340, 340], outline=(255, 255, 255, 170), width=14)
              d.ellipse([216, 216, 296, 296], fill=(255, 255, 255, 255))

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, sz in sizes.items():
              out_dir = f'android/app/src/main/res/{folder}'
              os.makedirs(out_dir, exist_ok=True)
              base_icon.resize((sz, sz), Image.Resampling.LANCZOS).save(f'{out_dir}/ic_launcher.png')

          # 2. AndroidManifest.xml: INTERNET + App Label + Queries (WA/Maps)
          manifest = 'android/app/src/main/AndroidManifest.xml'
          s = open(manifest).read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = re.sub(r'android:label="[^"]*"', f'android:label="{app_name}"', s, count=1)
          if 'https' not in s and '</manifest>' in s:
              queries = '<queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n    </queries>\n</manifest>'
              s = s.replace('</manifest>', queries)
          open(manifest, 'w').write(s)

          # 3. Gradle: Target SDK 35, Compile SDK 35, Min SDK 23, Signing Release Keystore
          kts_path = 'android/app/build.gradle.kts'
          grv_path = 'android/app/build.gradle'
          if os.path.exists(kts_path):
              g = open(kts_path).read()
              g = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', g)
              g = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36', g)
              g = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 23', g)
              g = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{app_id}"', g)
              sign_block = '''
              signingConfigs {
                  create("release") {
                      storeFile = file("mrdtrack-release-key.jks")
                      storePassword = "MrdTrack2026!"
                      keyAlias = "mrdtrack-key"
                      keyPassword = "MrdTrack2026!"
                  }
              }
              buildTypes {'''
              g = g.replace('buildTypes {', sign_block, 1)
              g = g.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              open(kts_path, 'w').write(g)
          elif os.path.exists(grv_path):
              g = open(grv_path).read()
              g = re.sub(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 36', g)
              g = re.sub(r'compileSdk\s+[^\n]+', 'compileSdk 36', g)
              g = re.sub(r'targetSdkVersion\s+[^\n]+', 'targetSdkVersion 36', g)
              g = re.sub(r'targetSdk\s+[^\n]+', 'targetSdk 36', g)
              g = re.sub(r'minSdkVersion\s+[^\n]+', 'minSdkVersion 23', g)
              g = re.sub(r'minSdk\s+[^\n]+', 'minSdk 23', g)
              g = re.sub(r'applicationId\s+"[^"]+"', f'applicationId "{app_id}"', g)
              sign_block = '''
              signingConfigs {
                  release {
                      storeFile file("mrdtrack-release-key.jks")
                      storePassword "MrdTrack2026!"
                      keyAlias "mrdtrack-key"
                      keyPassword "MrdTrack2026!"
                  }
              }
              buildTypes {'''
              g = g.replace('buildTypes {', sign_block, 1)
              g = g.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              open(grv_path, 'w').write(g)
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-infos

      - name: Build Signed APK & AAB (Play Store)
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'MRD Track' }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://mrdtrack.mrdsolution.my.id' }}
          PRIMARY_HEX: ${{ github.event.inputs.primary_hex || '2563EB' }}
          VER_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          VER_NUM: ${{ github.event.inputs.build_number || '1' }}
        run: |
          flutter build apk --release \
            --build-name="$VER_NAME" --build-number="$VER_NUM" \
            --dart-define=APP_NAME="$APP_NAME" \
            --dart-define=BASE_URL="$BASE_URL" \
            --dart-define=PRIMARY_HEX="$PRIMARY_HEX"

          flutter build appbundle --release \
            --build-name="$VER_NAME" --build-number="$VER_NUM" \
            --dart-define=APP_NAME="$APP_NAME" \
            --dart-define=BASE_URL="$BASE_URL" \
            --dart-define=PRIMARY_HEX="$PRIMARY_HEX"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MRDTrack-Signed-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Signed AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: MRDTrack-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
